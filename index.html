<!DOCTYPE html>
<html lang="tr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <meta
        name="theme-color"
        content="#0A0A0F">

    <meta
        name="description"
        content="Lotus AI - Modern AI Assistant">

    <meta
        name="keywords"
        content="Lotus AI, AI, Artificial Intelligence, Chatbot">

    <meta
        name="author"
        content="Lotus AI">

    <meta
        name="apple-mobile-web-app-capable"
        content="yes">

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="black-translucent">

    <meta
        name="mobile-web-app-capable"
        content="yes">

    <title>Lotus AI</title>

    <!-- Manifest -->

    <link
        rel="manifest"
        href="manifest.json">

    <!-- Icons -->

    <link
        rel="icon"
        href="assets/icons/icon.png">

    <link
        rel="apple-touch-icon"
        href="assets/icons/icon.png">

    <!-- Fonts -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=DM+Sans:wght@300;400;500;700&display=swap"
        rel="stylesheet">

    <!-- CSS -->
    <link
        rel="stylesheet"
        href="css/fonts.css">
    <link
        rel="stylesheet"
        href="css/main.css">

    <link
        rel="stylesheet"
        href="css/chat.css">

    <link
        rel="stylesheet"
        href="css/settings.css">

    <link
        rel="stylesheet"
        href="css/themes.css">

    <link
        rel="stylesheet"
        href="css/animations.css">

    <link
        rel="stylesheet"
        href="css/markdown.css">

</head>

<body>

<!-- ===================================================== -->
<!-- SPLASH SCREEN -->
<!-- ===================================================== -->

<div id="splash-screen">

    <div class="splash-container">

        <img
            src="assets/icons/icon.png"
            alt="Lotus AI"
            id="splash-logo">

        <h1 id="splash-title">

            Lotus AI

        </h1>

        <p id="splash-text">

            Initializing...

        </p>

        <div id="splash-loader">

            <div id="loader-bar"></div>

        </div>

    </div>

</div>
<!-- ===================================================== -->
<!-- FIRST SETUP -->
<!-- ===================================================== -->

<div
    id="setup-modal"
    class="hidden">

    <div class="setup-card">

        <h2>

            Hoş Geldin

        </h2>

        <p>

            Başlamak için bir AI sağlayıcısı seç.

        </p>

        <select id="provider-select">

            <option value="groq">Groq</option>

            <option value="gemini">Gemini</option>

            <option value="openai">OpenAI</option>

            <option value="deepseek">DeepSeek</option>

            <option value="openrouter">OpenRouter</option>

            <option value="ollama">Ollama (Yerel)</option>

            <option value="custom">Özel API</option>

        </select>

        <input
            type="password"
            id="api-key"
            placeholder="API Key">

        <button id="save-api">

            Devam Et

        </button>

    </div>

</div>
<!-- ===================================================== -->
<!-- APPLICATION -->
<!-- ===================================================== -->

<div id="app">

    <!-- ================================================ -->
    <!-- SIDEBAR -->
    <!-- ================================================ -->

    <aside id="sidebar">

        <div id="sidebar-header">

            <img
                src="assets/icons/icon.png"
                alt="Lotus AI"
                id="sidebar-logo">

            <h2>

                Lotus AI

            </h2>

        </div>

        <button id="new-chat-button">

            + Yeni Sohbet

        </button>

        <div id="sidebar-search">

    <input
        type="text"
        id="search-chat"
        placeholder="Sohbet ara...">

        </div>
        
        <div id="chat-list">

            <!-- Sohbetler JavaScript ile oluşturulacak -->

        </div>

<div id="sidebar-menu">

    <button>
        💬 Sohbetler
    </button>

    <button>
        🧠 Hafıza
    </button>

    <button>
        🎨 Görünüm
    </button>

    <button>
        🖼 Görseller
    </button>

    <button>
        🌐 Web Araçları
    </button>

    <button>
        ⚙ Ayarlar
    </button>

    <button>
        ℹ Hakkında
    </button>

</div>

        <div id="sidebar-footer">

            <button id="settings-button">

                Ayarlar

            </button>

        </div>

    </aside>

    <!-- ================================================ -->
    <!-- MAIN -->
    <!-- ================================================ -->

    <main id="main">

        <!-- HEADER -->

        <header id="header">

            <div id="header-left">

                <h1>

                    Lotus AI

                </h1>

                <span id="current-model">

                    Model Seçilmedi

                </span>

             <div id="connection-status">

    <span id="status-dot"></span>

    <span id="status-text">

        Hazır

    </span>
    
  </div>
 
</div>

            <div id="header-right">

                <button id="memory-button">

                    🧠

                </button>

                <button id="theme-button">

                    🎨

                </button>

                <button id="menu-button">

                    ☰

                </button>

            </div>

        </header>

        <!-- CHAT -->

        <section id="chat-container">

            <div id="chat">

                <!-- Mesajlar buraya gelecek -->
      <div id="welcome-screen">

    <img
        src="assets/icons/icon.png"
        alt="Lotus AI"
        id="welcome-logo">

    <h1>
        LOTUS AI
    </h1>

    <p>
        Bugün sana nasıl yardımcı olabilirim?
    </p>


    <div id="quick-actions">

        <button>
            💻 Kod Yaz
        </button>

        <button>
            🎨 Görsel Oluştur
        </button>

        <button>
            🌐 Web Analiz
        </button>

        <button>
            📄 Dosya Analiz
        </button>

    </div>

        </section>

        <!-- COMPOSER -->

        <footer id="composer">

            <button id="attach-button">

                📎

            </button>

            <textarea

                id="message-input"

                placeholder="Lotus AI'a mesaj gönder..."

                rows="1">

            </textarea>

            <button id="voice-button">

                🎤

            </button>
            
            <button id="stop-button">

                ■

            </button>
            
            <button id="send-button">

                ➤

            </button>

        </footer>

<!-- ===================================================== -->
<!-- SCROLL TO BOTTOM -->
<!-- ===================================================== -->

<button
    id="scroll-bottom"
    class="hidden"
    aria-label="En alta git">

    ↓

</button>

    </main>

</div>
<!-- ===================================================== -->
<!-- SETTINGS MODAL -->
<!-- ===================================================== -->

<div id="settings-modal" class="modal hidden">

    <div class="modal-content">

        <div class="modal-header">

            <h2>Ayarlar</h2>

            <button class="close-modal">

                ✕

            </button>

        </div>

        <div id="settings-content">

            <!-- JavaScript ile doldurulacak -->

        </div>

    </div>

</div>

<!-- ===================================================== -->
<!-- MEMORY MODAL -->
<!-- ===================================================== -->

<div id="memory-modal" class="modal hidden">

    <div class="modal-content">

        <div class="modal-header">

            <h2>Hafıza</h2>

            <button class="close-modal">

                ✕

            </button>

        </div>

        <div id="memory-list">

        </div>

    </div>

</div>

<!-- ===================================================== -->
<!-- ABOUT MODAL -->
<!-- ===================================================== -->

<div id="about-modal" class="modal hidden">

    <div class="modal-content">

        <img
            src="assets/icons/icon.png"
            alt="Lotus AI"
            class="about-logo">

        <h2>

            Lotus AI

        </h2>

        <p>

            Version 3.0 Alpha

        </p>

        <p>

            Modern AI Assistant

        </p>

    </div>

</div>

<!-- ===================================================== -->
<!-- IMAGE VIEWER -->
<!-- ===================================================== -->

<div id="image-viewer" class="hidden">

    <img
        id="preview-image"
        alt="Preview">

</div>

<!-- ===================================================== -->
<!-- CONTEXT MENU -->
<!-- ===================================================== -->

<div id="context-menu" class="hidden">

    <button id="rename-chat">

        Yeniden Adlandır

    </button>

    <button id="pin-chat">

        Sabitle

    </button>

    <button id="delete-chat">

        Sil

    </button>

</div>

<!-- ===================================================== -->
<!-- LOADING -->
<!-- ===================================================== -->

<div id="loading-overlay" class="hidden">

    <div class="loader"></div>

    <p>

        Lotus düşünüyor...

    </p>

</div>

<!-- ===================================================== -->
<!-- TOAST -->
<!-- ===================================================== -->

<div id="toast-container"></div>

<!-- ===================================================== -->
<!-- FILE INPUT -->
<!-- ===================================================== -->

<input
    type="file"
    id="file-input"
    hidden
    multiple>
<!-- ===================================================== -->
<!-- MOBILE MENU -->
<!-- ===================================================== -->

<div
    id="mobile-menu"
    class="hidden">

    <button id="mobile-new-chat">

        + Yeni Sohbet

    </button>

    <button id="mobile-memory">

        🧠 Hafıza

    </button>

    <button id="mobile-settings">

        ⚙ Ayarlar

    </button>

    <button id="mobile-about">

        ℹ Hakkında

    </button>

</div>
    <!-- ===================================================== -->
<!-- JAVASCRIPT -->
<!-- ===================================================== -->

<script type="module" src="js/config.js"></script>
<script type="module" src="js/storage.js"></script>
<script type="module" src="js/themes.js"></script>
<script type="module" src="js/markdown.js"></script>
<script type="module" src="js/memory.js"></script>
<script type="module" src="js/speech.js"></script>
<script type="module" src="js/api.js"></script>
<script type="module" src="js/commands.js"></script>
<script type="module" src="js/chat.js"></script>
<script type="module" src="js/ui.js"></script>
<script type="module" src="js/utils.js"></script>
<script type="module" src="js/app.js"></script>

</body>
</html>
